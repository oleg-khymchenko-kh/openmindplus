# Mirror of the live /etc/nginx/sites-enabled/openmindplus.com.conf.
#
# Keep this file in sync with the server: it is documentation AND the thing
# someone will copy across when rebuilding the box. It is not applied by
# scripts/deploy.sh, which only runs `nginx -t && systemctl reload nginx`.
#
# Both server blocks below are frontend-in-server-mode: nothing is served from
# disk except /uploads/. The ssl_* lines are managed by certbot — on a fresh
# machine run certbot first, or nginx will refuse to start on the missing
# certificate files.

server {
    server_name openmindplus.com www.openmindplus.com;

    access_log /home/openmindplus.com/logs/nginx/access.log;
    error_log /home/openmindplus.com/logs/nginx/error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    # Fastify backend. Cookie is forwarded explicitly because auth reads the
    # JWT straight out of the cookie header (see backend/app/routes/agents.js).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Next.js runs as a server (PM2 openmindplus-frontend), not a static export.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_cache_bypass $http_upgrade;
    }

    # Team photos and project logos, uploaded outside the repo.
    location /uploads/ {
        alias /home/openmindplus.com/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; allow all; }
    location ~ /\. { deny all; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/openmindplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openmindplus.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.openmindplus.com) { return 301 https://$host$request_uri; }
    if ($host = openmindplus.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name openmindplus.com www.openmindplus.com;
    return 404;
}
